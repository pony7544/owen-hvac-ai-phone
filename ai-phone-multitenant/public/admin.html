<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Platform Admin</title>
  <style>
    *{box-sizing:border-box;margin:0}
    body{font-family:'Segoe UI',system-ui,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
    .topbar{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:#1e293b;border-bottom:1px solid #334155}
    .topbar h1{font-size:16px;font-weight:600;color:#93c5fd}
    .topbar a{color:#94a3b8;text-decoration:none;font-size:13px}
    .main{max-width:900px;margin:0 auto;padding:32px 20px}
    .card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:24px;margin-bottom:20px}
    .card h2{font-size:15px;font-weight:600;color:#93c5fd;margin-bottom:16px}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th{text-align:left;padding:8px 10px;color:#64748b;font-weight:600;border-bottom:1px solid #334155}
    td{padding:8px 10px;border-bottom:1px solid #1e293b;vertical-align:middle}
    .btn{border:0;border-radius:8px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;transition:.15s}
    .btn-sm{padding:5px 10px;font-size:11px}
    .btn-blue{background:#3b82f6;color:#fff}.btn-blue:hover{background:#2563eb}
    .btn-red{background:#ef4444;color:#fff}.btn-red:hover{background:#dc2626}
    .btn-gray{background:#334155;color:#cbd5e1}.btn-gray:hover{background:#475569}
    .form-group{margin-bottom:14px}
    .form-group label{display:block;font-size:12px;color:#94a3b8;margin-bottom:4px;font-weight:600}
    .input{width:100%;background:#0f172a;border:1px solid #334155;border-radius:8px;padding:10px 12px;font-size:13px;color:#e2e8f0;outline:none;font-family:inherit}
    .input:focus{border-color:#3b82f6}
    textarea.input{min-height:120px;resize:vertical;line-height:1.5}
    .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;justify-content:center;align-items:flex-start;padding-top:60px;overflow-y:auto}
    .modal-bg.open{display:flex}
    .modal{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:28px;width:600px;max-height:85vh;overflow-y:auto;margin:20px}
    .modal h3{font-size:16px;margin-bottom:18px;color:#f1f5f9}
    .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .webhook-url{font-family:monospace;font-size:12px;color:#60a5fa;background:#0f172a;padding:6px 10px;border-radius:6px;word-break:break-all;margin-top:4px}
    .tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600}
    .tag-green{background:#064e3b;color:#6ee7b7}
    .tag-gray{background:#334155;color:#94a3b8}
    .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
    .business-hours-grid{display:grid;gap:10px;margin-top:12px}
    .hour-row{display:grid;grid-template-columns:140px 1fr 30px 1fr;gap:8px;align-items:center;padding:8px;background:#0f172a;border-radius:6px}
    .hour-row label{display:flex;align-items:center;gap:8px;font-size:13px;color:#cbd5e1;margin:0;cursor:pointer}
    .hour-row input[type="checkbox"]{width:16px;height:16px;cursor:pointer}
    .hour-row input[type="time"]{padding:6px 8px;font-size:12px}
    .hour-row span{color:#64748b;font-size:12px;text-align:center}
    .hour-row.disabled{opacity:0.5}
    .hour-row.disabled input[type="time"]{pointer-events:none}
    .section-divider{border-top:1px solid #334155;margin:24px 0;padding-top:18px}
  </style>
</head>
<body>
  <div class="topbar">
    <h1>Platform Admin</h1>
    <div style="display:flex;gap:14px;align-items:center">
      <a href="/live">Dashboard</a>
      <a href="/logout">Logout</a>
    </div>
  </div>
  <div class="main">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <h2 style="margin:0">Tenants</h2>
        <button class="btn btn-blue" onclick="openModal()">+ Add Tenant</button>
      </div>
      <table>
        <thead><tr><th>ID</th><th>Business</th><th>Phone</th><th>Voice</th><th>Webhook</th><th>Calendar</th><th></th></tr></thead>
        <tbody id="tenantTable"><tr><td colspan="7" style="color:#64748b">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-bg" id="modalBg">
    <div class="modal">
      <h3 id="modalTitle">Add Tenant</h3>
      <input type="hidden" id="editId"/>
      <div class="row2">
        <div class="form-group"><label>Tenant ID (slug)</label><input class="input" id="fId" placeholder="owen-hvac"/></div>
        <div class="form-group"><label>Business Name</label><input class="input" id="fName" placeholder="Owen HVAC Corp"/></div>
      </div>
      <div class="row2">
        <div class="form-group"><label>Phone Number</label><input class="input" id="fPhone" placeholder="+19024001234"/></div>
        <div class="form-group"><label>Voice</label>
          <select class="input" id="fVoice">
            <option>alloy</option><option>ash</option><option>ballad</option><option>coral</option>
            <option>echo</option><option>sage</option><option>shimmer</option><option>verse</option>
            <option>marin</option><option>cedar</option>
          </select>
        </div>
      </div>
      <div class="row2">
        <div class="form-group"><label>Timezone</label><input class="input" id="fTz" placeholder="America/Halifax"/></div>
        <div class="form-group"><label>Appt Duration (min)</label><input class="input" id="fDuration" type="number" value="60"/></div>
      </div>
      <div class="form-group"><label>Greeting (TwiML Say)</label><input class="input" id="fGreeting" placeholder="Hello, thank you for calling..."/></div>
      <div class="form-group"><label>AI Prompt (conversation)</label><textarea class="input" id="fPrompt" placeholder="You are the phone receptionist for..."></textarea></div>
      <div class="form-group"><label>Extraction Prompt (data extraction from transcript)</label><textarea class="input" id="fExtractionPrompt" placeholder="You extract structured booking information from a phone call transcript..."></textarea></div>

      <h3 style="font-size:14px;margin:18px 0 12px;color:#94a3b8">Voice Controls</h3>
      <div class="form-group">
        <label>Speech Speed</label>
        <select class="input" id="fSpeed">
          <option value="slow">Slow — very clear, long pauses</option>
          <option value="moderate" selected>Moderate — calm, natural pace</option>
          <option value="fast">Fast — conversational</option>
        </select>
      </div>
      <div class="row2">
        <div class="form-group">
          <label>Voice Sensitivity: <span id="vadLabel">0.5</span></label>
          <input type="range" class="input" id="fVadThreshold" min="0" max="1" step="0.1" value="0.5"
                 oninput="document.getElementById('vadLabel').textContent=this.value"/>
        </div>
        <div class="form-group">
          <label>Silence Duration: <span id="silenceLabel">500</span>ms</label>
          <input type="range" class="input" id="fSilenceMs" min="100" max="2000" step="100" value="500"
                 oninput="document.getElementById('silenceLabel').textContent=this.value"/>
        </div>
      </div>

      <!-- 营业时间 — ID 全部使用完整单词，与 JS capitalize(day) 保持一致 -->
      <div class="section-divider">
        <h3 style="font-size:14px;margin:0 0 12px;color:#94a3b8">Business Hours</h3>
        <div class="business-hours-grid">
          <div class="hour-row" id="rowMonday">
            <label><input type="checkbox" id="bhMondayEnabled" checked onchange="toggleDayRow('monday')"/> Monday</label>
            <input type="time" class="input" id="bhMondayOpen" value="09:00"/>
            <span>to</span>
            <input type="time" class="input" id="bhMondayClose" value="17:00"/>
          </div>
          <div class="hour-row" id="rowTuesday">
            <label><input type="checkbox" id="bhTuesdayEnabled" checked onchange="toggleDayRow('tuesday')"/> Tuesday</label>
            <input type="time" class="input" id="bhTuesdayOpen" value="09:00"/>
            <span>to</span>
            <input type="time" class="input" id="bhTuesdayClose" value="17:00"/>
          </div>
          <div class="hour-row" id="rowWednesday">
            <label><input type="checkbox" id="bhWednesdayEnabled" checked onchange="toggleDayRow('wednesday')"/> Wednesday</label>
            <input type="time" class="input" id="bhWednesdayOpen" value="09:00"/>
            <span>to</span>
            <input type="time" class="input" id="bhWednesdayClose" value="17:00"/>
          </div>
          <div class="hour-row" id="rowThursday">
            <label><input type="checkbox" id="bhThursdayEnabled" checked onchange="toggleDayRow('thursday')"/> Thursday</label>
            <input type="time" class="input" id="bhThursdayOpen" value="09:00"/>
            <span>to</span>
            <input type="time" class="input" id="bhThursdayClose" value="17:00"/>
          </div>
          <div class="hour-row" id="rowFriday">
            <label><input type="checkbox" id="bhFridayEnabled" checked onchange="toggleDayRow('friday')"/> Friday</label>
            <input type="time" class="input" id="bhFridayOpen" value="09:00"/>
            <span>to</span>
            <input type="time" class="input" id="bhFridayClose" value="17:00"/>
          </div>
          <div class="hour-row disabled" id="rowSaturday">
            <label><input type="checkbox" id="bhSaturdayEnabled" onchange="toggleDayRow('saturday')"/> Saturday</label>
            <input type="time" class="input" id="bhSaturdayOpen" value="10:00"/>
            <span>to</span>
            <input type="time" class="input" id="bhSaturdayClose" value="14:00"/>
          </div>
          <div class="hour-row disabled" id="rowSunday">
            <label><input type="checkbox" id="bhSundayEnabled" onchange="toggleDayRow('sunday')"/> Sunday</label>
            <input type="time" class="input" id="bhSundayOpen" value="10:00"/>
            <span>to</span>
            <input type="time" class="input" id="bhSundayClose" value="14:00"/>
          </div>
        </div>
      </div>

      <h3 style="font-size:14px;margin:18px 0 12px;color:#94a3b8">Admin Credentials (for /admin login)</h3>
      <div class="row2">
        <div class="form-group"><label>Username</label><input class="input" id="fUser"/></div>
        <div class="form-group"><label>Password</label><input class="input" id="fPass" type="password"/></div>
      </div>

      <h3 style="font-size:14px;margin:18px 0 12px;color:#94a3b8">Google Calendar Integration (optional)</h3>
      <div class="row2">
        <div class="form-group"><label>Client ID</label><input class="input" id="fGClientId"/></div>
        <div class="form-group"><label>Client Secret</label><input class="input" id="fGSecret"/></div>
      </div>
      <div class="row2">
        <div class="form-group"><label>Refresh Token</label><input class="input" id="fGRefresh"/></div>
        <div class="form-group"><label>Calendar ID</label><input class="input" id="fGCalId" placeholder="primary"/></div>
      </div>

      <div class="actions">
        <button class="btn btn-gray" onclick="closeModal()">Cancel</button>
        <button class="btn btn-blue" onclick="saveTenant()">Save</button>
      </div>
    </div>
  </div>

  <script>
    const BASE = window.location.origin;
    async function api(url, opts = {}) {
      const res = await fetch(url, {
        ...opts,
        headers: { 'Content-Type': 'application/json', ...opts.headers }
      });
      return res.json();
    }

    async function loadTenants() {
      const data = await api('/api/admin/tenants');
      if (!data.ok) return;
      const tb = document.getElementById('tenantTable');
      if (!data.tenants.length) { tb.innerHTML = '<tr><td colspan="7" style="color:#64748b">No tenants yet.</td></tr>'; return; }
      tb.innerHTML = data.tenants.map(t => `
        <tr>
          <td><strong>${esc(t.id)}</strong></td>
          <td>${esc(t.businessName)}</td>
          <td>${esc(t.phoneNumber || '—')}</td>
          <td>${esc(t.voice)}</td>
          <td><div class="webhook-url">${BASE}/twilio/voice/${esc(t.id)}</div></td>
          <td>${t.hasCalendar ? '<span class="tag tag-green">OK</span>' : '<span class="tag tag-gray">None</span>'}</td>
          <td style="white-space:nowrap">
            <button class="btn btn-sm btn-gray" onclick="editTenant('${esc(t.id)}')">Edit</button>
            <button class="btn btn-sm btn-red" onclick="delTenant('${esc(t.id)}')">Delete</button>
          </td>
        </tr>
      `).join('');
    }

    function capitalize(s) {
      return s.charAt(0).toUpperCase() + s.slice(1);
    }

    // ID 格式: bh{Fullday}Enabled / bh{Fullday}Open / bh{Fullday}Close
    // row ID:  row{Fullday}
    // 全部与 HTML 一致，无需映射表
    function toggleDayRow(day) {
      const cap = capitalize(day);
      const enabled = document.getElementById(`bh${cap}Enabled`).checked;
      document.getElementById(`row${cap}`).classList.toggle('disabled', !enabled);
    }

    function openModal(data) {
      document.getElementById('modalTitle').textContent = data ? 'Edit Tenant' : 'Add Tenant';
      document.getElementById('editId').value = data?.id || '';
      document.getElementById('fId').value = data?.id || '';
      document.getElementById('fId').disabled = !!data;
      document.getElementById('fName').value = data?.businessName || '';
      document.getElementById('fPhone').value = data?.phoneNumber || '';
      document.getElementById('fVoice').value = data?.voice || 'alloy';
      document.getElementById('fTz').value = data?.timezone || 'America/Halifax';
      document.getElementById('fDuration').value = data?.defaultAppointmentMinutes || 60;
      document.getElementById('fGreeting').value = data?.greeting || '';
      document.getElementById('fPrompt').value = data?.prompt || '';
      document.getElementById('fExtractionPrompt').value = data?.extractionPrompt || '';
      document.getElementById('fSpeed').value = data?.speechSpeed || 'moderate';
      document.getElementById('fVadThreshold').value = data?.vadThreshold ?? 0.5;
      document.getElementById('vadLabel').textContent = data?.vadThreshold ?? 0.5;
      document.getElementById('fSilenceMs').value = data?.silenceDurationMs ?? 500;
      document.getElementById('silenceLabel').textContent = data?.silenceDurationMs ?? 500;
      document.getElementById('fUser').value = data?.adminUser || '';
      document.getElementById('fPass').value = data?.adminPass || '';
      document.getElementById('fGClientId').value = data?.google?.clientId || '';
      document.getElementById('fGSecret').value = data?.google?.clientSecret || '';
      document.getElementById('fGRefresh').value = data?.google?.refreshToken || '';
      document.getElementById('fGCalId').value = data?.google?.calendarId || 'primary';

      // 营业时间 — 使用完整单词 ID，与 HTML 完全匹配
      const days = ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday'];
      const defaultClose = { saturday: '14:00', sunday: '14:00' };
      const defaultOpen  = { saturday: '10:00', sunday: '10:00' };
      const defaultEnabled = { saturday: false, sunday: false };

      days.forEach(day => {
        const cap     = capitalize(day);
        const dayData = data?.businessHours?.[day];
        const enabled = dayData ? dayData.enabled !== false : (defaultEnabled[day] !== true ? defaultEnabled[day] !== false : true);
        // 更清晰的默认值逻辑
        const isWeekend = day === 'saturday' || day === 'sunday';
        const resolvedEnabled = dayData ? dayData.enabled !== false : !isWeekend;
        const resolvedOpen    = dayData?.open  || defaultOpen[day]  || '09:00';
        const resolvedClose   = dayData?.close || defaultClose[day] || '17:00';

        document.getElementById(`bh${cap}Enabled`).checked = resolvedEnabled;
        document.getElementById(`bh${cap}Open`).value      = resolvedOpen;
        document.getElementById(`bh${cap}Close`).value     = resolvedClose;
        document.getElementById(`row${cap}`).classList.toggle('disabled', !resolvedEnabled);
      });

      document.getElementById('modalBg').classList.add('open');
    }

    function closeModal() { document.getElementById('modalBg').classList.remove('open'); }

    async function editTenant(id) {
      const data = await api(`/api/admin/tenants/${id}`);
      if (data.ok) openModal(data.tenant);
    }

    async function saveTenant() {
      const editId = document.getElementById('editId').value;

      const days = ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday'];
      const businessHours = {};
      days.forEach(day => {
        const cap = capitalize(day);
        businessHours[day] = {
          enabled: document.getElementById(`bh${cap}Enabled`).checked,
          open:    document.getElementById(`bh${cap}Open`).value,
          close:   document.getElementById(`bh${cap}Close`).value,
        };
      });

      const body = {
        id: document.getElementById('fId').value.trim(),
        businessName: document.getElementById('fName').value.trim(),
        phoneNumber: document.getElementById('fPhone').value.trim(),
        voice: document.getElementById('fVoice').value,
        timezone: document.getElementById('fTz').value.trim(),
        defaultAppointmentMinutes: parseInt(document.getElementById('fDuration').value) || 60,
        greeting: document.getElementById('fGreeting').value.trim(),
        prompt: document.getElementById('fPrompt').value.trim(),
        extractionPrompt: document.getElementById('fExtractionPrompt').value.trim(),
        speechSpeed: document.getElementById('fSpeed').value,
        vadThreshold: parseFloat(document.getElementById('fVadThreshold').value) || 0.5,
        silenceDurationMs: parseInt(document.getElementById('fSilenceMs').value) || 500,
        adminUser: document.getElementById('fUser').value.trim(),
        adminPass: document.getElementById('fPass').value,
        businessHours,
        google: {
          clientId: document.getElementById('fGClientId').value.trim(),
          clientSecret: document.getElementById('fGSecret').value.trim(),
          refreshToken: document.getElementById('fGRefresh').value.trim(),
          calendarId: document.getElementById('fGCalId').value.trim() || 'primary',
        },
      };

      const url    = editId ? `/api/admin/tenants/${editId}` : '/api/admin/tenants';
      const method = editId ? 'PUT' : 'POST';
      const res = await api(url, { method, body: JSON.stringify(body) });
      if (res.ok) { closeModal(); loadTenants(); } else { alert(res.error || 'Failed'); }
    }

    async function delTenant(id) {
      if (!confirm(`Delete tenant "${id}"?`)) return;
      const res = await api(`/api/admin/tenants/${id}`, { method: 'DELETE' });
      if (res.ok) loadTenants(); else alert(res.error || 'Failed');
    }

    function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    loadTenants();
  </script>
</body>
</html>
