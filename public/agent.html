<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI Agent — Owen HVAC</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #0b0f1a;
      color: #e2e8f0;
      min-height: 100vh;
    }

    /* ── Topbar ── */
    .topbar {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      background: rgba(15,20,35,0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .topbar-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .topbar-nav {
      display: flex;
      gap: 8px;
    }

    .topbar-nav a {
      color: #94a3b8;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 8px;
      transition: 0.2s;
    }

    .topbar-nav a:hover { color: #e2e8f0; background: rgba(255,255,255,0.06); }

    /* ── Main Layout ── */
    .main {
      max-width: 960px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    .hero {
      text-align: center;
      margin-bottom: 48px;
    }

    .hero h1 {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #f1f5f9, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      color: #64748b;
      font-size: 16px;
      max-width: 520px;
      margin: 0 auto;
      line-height: 1.6;
    }

    /* ── Card ── */
    .card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 20px;
      padding: 32px;
      margin-bottom: 24px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #64748b;
      margin-bottom: 20px;
    }

    /* ── Form Elements ── */
    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 8px;
    }

    .input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 15px;
      font-family: 'DM Sans', sans-serif;
      color: #e2e8f0;
      outline: none;
      transition: 0.2s;
    }

    .input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
    }

    .input::placeholder { color: #475569; }

    textarea.input {
      min-height: 120px;
      resize: vertical;
      line-height: 1.6;
    }

    .phone-row {
      display: flex;
      gap: 12px;
    }

    .phone-row .input { flex: 1; }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: none;
      border-radius: 12px;
      padding: 14px 28px;
      font-size: 15px;
      font-weight: 600;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }

    .btn-primary {
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: #fff;
      box-shadow: 0 4px 20px rgba(59,130,246,0.3);
    }

    .btn-primary:hover { box-shadow: 0 6px 28px rgba(59,130,246,0.4); }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-danger {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: #fff;
      box-shadow: 0 4px 20px rgba(239,68,68,0.3);
    }

    .btn-ghost {
      background: rgba(255,255,255,0.05);
      color: #94a3b8;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .btn-ghost:hover { background: rgba(255,255,255,0.08); color: #e2e8f0; }

    .btn-row {
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }

    /* ── Status indicator ── */
    .status-bar {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 16px 20px;
      border-radius: 14px;
      margin-bottom: 24px;
      font-size: 14px;
      font-weight: 500;
    }

    .status-bar.active {
      display: flex;
      background: rgba(59,130,246,0.1);
      border: 1px solid rgba(59,130,246,0.2);
      color: #93c5fd;
    }

    .status-bar.completed {
      display: flex;
      background: rgba(34,197,94,0.1);
      border: 1px solid rgba(34,197,94,0.2);
      color: #86efac;
    }

    .status-bar.error {
      display: flex;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.2);
      color: #fca5a5;
    }

    .pulse-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #3b82f6;
      animation: pulse 1.5s ease-in-out infinite;
    }

    .status-bar.completed .pulse-dot { background: #22c55e; animation: none; }
    .status-bar.error .pulse-dot { background: #ef4444; animation: none; }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    /* ── Transcript ── */
    .transcript-box {
      display: none;
      max-height: 400px;
      overflow-y: auto;
      padding: 4px 0;
    }

    .transcript-box.visible { display: block; }

    .t-msg {
      padding: 12px 16px;
      border-radius: 12px;
      margin-bottom: 8px;
      font-size: 14px;
      line-height: 1.55;
    }

    .t-msg.caller {
      background: rgba(251,191,36,0.08);
      border-left: 3px solid #f59e0b;
    }

    .t-msg.assistant {
      background: rgba(59,130,246,0.08);
      border-left: 3px solid #3b82f6;
    }

    .t-role {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 4px;
      opacity: 0.6;
    }

    /* ── Summary ── */
    .summary-box {
      display: none;
      background: rgba(34,197,94,0.05);
      border: 1px solid rgba(34,197,94,0.15);
      border-radius: 16px;
      padding: 24px;
      margin-top: 24px;
      line-height: 1.7;
      font-size: 14px;
    }

    .summary-box.visible { display: block; }

    .summary-box h3 {
      font-size: 15px;
      font-weight: 700;
      color: #86efac;
      margin-bottom: 12px;
    }

    .summary-content {
      white-space: pre-wrap;
      color: #cbd5e1;
    }

    /* ── Recording ── */
    .recording-box {
      display: none;
      margin-top: 20px;
    }

    .recording-box.visible { display: block; }

    .recording-box audio {
      width: 100%;
      margin-top: 8px;
      border-radius: 8px;
    }

    /* ── Spinner ── */
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Timer ── */
    .timer {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: #64748b;
      margin-left: auto;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-title">Owen HVAC — AI Agent</div>
    <div class="topbar-nav">
      <a href="/live">Dashboard</a>
      <a href="/logout">Logout</a>
    </div>
  </div>

  <div class="main">
    <div class="hero">
      <h1>AI Phone Agent</h1>
      <p>Enter a phone number and describe the task. The AI agent will call and complete it for you.</p>
    </div>

    <!-- Status Bar -->
    <div class="status-bar" id="statusBar">
      <div class="pulse-dot"></div>
      <span id="statusText">Calling...</span>
      <span class="timer" id="callTimer"></span>
    </div>

    <!-- Config Card -->
    <div class="card" id="configCard">
      <div class="card-title">Call Configuration</div>

      <div class="form-group">
        <label>Phone Number</label>
        <div class="phone-row">
          <input type="tel" class="input" id="phoneInput" placeholder="+1 (902) 555-0123" />
        </div>
      </div>

      <div class="form-group">
        <label>Agent Task Instructions</label>
        <textarea class="input" id="taskInput" placeholder="Example: Call this restaurant and make a reservation for 2 people this Saturday at 7pm under the name John Smith. Ask about parking options."></textarea>
      </div>

      <div class="btn-row">
        <button class="btn btn-primary" id="callBtn" onclick="startCall()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
          Start Call
        </button>
      </div>
    </div>

    <!-- Live Transcript Card -->
    <div class="card" id="transcriptCard" style="display:none;">
      <div class="card-title" style="display:flex; align-items:center; justify-content:space-between;">
        Live Transcript
        <button class="btn btn-danger" id="hangupBtn" onclick="hangupCall()" style="padding:8px 16px; font-size:13px;">
          Hang Up
        </button>
      </div>
      <div class="transcript-box visible" id="transcriptBox"></div>
    </div>

    <!-- Summary Card -->
    <div class="summary-box" id="summaryBox">
      <h3>📋 Call Summary</h3>
      <div class="summary-content" id="summaryContent"></div>
    </div>

    <!-- Recording Card -->
    <div class="recording-box" id="recordingBox">
      <div class="card">
        <div class="card-title">Call Recording</div>
        <audio id="recordingPlayer" controls></audio>
      </div>
    </div>
  </div>

  <script>
    let activeCallSid = null;
    let pollInterval  = null;
    let timerInterval = null;
    let callStartTime = null;

    function formatPhone(val) {
      // Strip non-digit except leading +
      const hasPlus = val.startsWith('+');
      let digits = val.replace(/\D/g, '');
      if (hasPlus) digits = '+' + digits;
      else if (digits.length === 10) digits = '+1' + digits;
      else if (digits.length === 11 && digits.startsWith('1')) digits = '+' + digits;
      return digits;
    }

    function updateTimer() {
      if (!callStartTime) return;
      const elapsed = Math.floor((Date.now() - callStartTime) / 1000);
      const m = Math.floor(elapsed / 60).toString().padStart(2, '0');
      const s = (elapsed % 60).toString().padStart(2, '0');
      document.getElementById('callTimer').textContent = `${m}:${s}`;
    }

    function setStatus(type, text) {
      const bar = document.getElementById('statusBar');
      bar.className = 'status-bar ' + type;
      document.getElementById('statusText').textContent = text;
    }

    async function startCall() {
      const phone = formatPhone(document.getElementById('phoneInput').value.trim());
      const task  = document.getElementById('taskInput').value.trim();

      if (!phone || phone.length < 10) {
        alert('Please enter a valid phone number.');
        return;
      }
      if (!task) {
        alert('Please describe the task for the agent.');
        return;
      }

      const btn = document.getElementById('callBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Initiating...';

      try {
        const res = await fetch('/api/agent/call', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, task }),
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || 'Failed to start call');

        activeCallSid = data.callSid;
        callStartTime = Date.now();

        // UI transitions
        setStatus('active', 'Calling ' + phone + '...');
        document.getElementById('configCard').style.opacity = '0.5';
        document.getElementById('configCard').style.pointerEvents = 'none';
        document.getElementById('transcriptCard').style.display = 'block';
        document.getElementById('transcriptBox').innerHTML = '';
        document.getElementById('summaryBox').classList.remove('visible');
        document.getElementById('recordingBox').classList.remove('visible');

        timerInterval = setInterval(updateTimer, 1000);
        pollInterval  = setInterval(pollCallStatus, 2000);

      } catch (err) {
        alert(err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg> Start Call`;
      }
    }

    async function hangupCall() {
      if (!activeCallSid) return;
      try {
        await fetch(`/api/agent/call/${encodeURIComponent(activeCallSid)}/hangup`, { method: 'POST' });
      } catch (_) {}
    }

    let lastTranscriptLen = 0;

    async function pollCallStatus() {
      if (!activeCallSid) return;

      try {
        const res  = await fetch(`/api/agent/call/${encodeURIComponent(activeCallSid)}`);
        const data = await res.json();
        if (!data.ok) return;

        const call = data.call;

        // Update status
        const status = (call.status || '').toLowerCase();
        if (status.includes('in_progress') || status === 'initiated' || status === 'ringing') {
          setStatus('active', status === 'ringing' ? 'Ringing...' : 'Call in progress...');
        }

        // Update transcript
        const transcript = call.transcript || [];
        if (transcript.length > lastTranscriptLen) {
          const box = document.getElementById('transcriptBox');
          for (let i = lastTranscriptLen; i < transcript.length; i++) {
            const msg = transcript[i];
            const div = document.createElement('div');
            div.className = 't-msg ' + (msg.role === 'assistant' ? 'assistant' : 'caller');
            div.innerHTML = `<div class="t-role">${msg.role === 'assistant' ? 'AI Agent' : 'Callee'}</div><div>${escapeHtml(msg.text)}</div>`;
            box.appendChild(div);
          }
          box.scrollTop = box.scrollHeight;
          lastTranscriptLen = transcript.length;
        }

        // Check if call ended
        if (status === 'completed' || status === 'stream_closed' || status === 'failed' || status === 'busy' || status === 'no-answer') {
          clearInterval(pollInterval);
          clearInterval(timerInterval);
          pollInterval = null;

          document.getElementById('hangupBtn').style.display = 'none';
          document.getElementById('configCard').style.opacity = '1';
          document.getElementById('configCard').style.pointerEvents = 'auto';

          if (status === 'failed' || status === 'busy' || status === 'no-answer') {
            setStatus('error', 'Call ' + status);
          } else {
            setStatus('completed', 'Call completed');

            // Load summary
            try {
              const sumRes  = await fetch(`/api/agent/call/${encodeURIComponent(activeCallSid)}/summary`);
              const sumData = await sumRes.json();
              if (sumData.ok && sumData.summary) {
                document.getElementById('summaryContent').textContent = sumData.summary;
                document.getElementById('summaryBox').classList.add('visible');
              }
            } catch (_) {}

            // Load recording
            try {
              const recRes  = await fetch(`/api/live-call/${encodeURIComponent(activeCallSid)}/recording/info`);
              const recData = await recRes.json();
              if (recData.available) {
                const player = document.getElementById('recordingPlayer');
                player.src = `/api/live-call/${encodeURIComponent(activeCallSid)}/recording/stream?channel=both&t=${Date.now()}`;
                document.getElementById('recordingBox').classList.add('visible');
              }
            } catch (_) {}
          }

          // Reset for next call
          activeCallSid  = null;
          lastTranscriptLen = 0;
          callStartTime  = null;
        }

      } catch (err) {
        console.error('Poll error:', err);
      }
    }

    function escapeHtml(s) {
      return String(s || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
