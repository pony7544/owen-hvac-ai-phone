<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Login - Owen HVAC</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
    }
    .card {
      width: 360px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      padding: 28px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }
    p {
      margin: 0 0 20px;
      color: #666;
    }
    label {
      display: block;
      margin: 12px 0 6px;
      font-size: 14px;
      color: #333;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #d7dce5;
      border-radius: 10px;
      font-size: 14px;
    }
    button {
      width: 100%;
      margin-top: 18px;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: #0f172a;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }
    button:hover {
      opacity: 0.95;
    }
  </style>
</head>
<body>
  <form class="card" method="POST" action="/login">
    <h1>Live Dashboard Login</h1>
    <p>Sign in to access the call monitor.</p>

    <label>Username</label>
    <input type="text" name="username" autocomplete="username" required />

    <label>Password</label>
    <input type="password" name="password" autocomplete="current-password" required />

    <button type="submit">Sign In</button>
  </form>
</body>
</html>
