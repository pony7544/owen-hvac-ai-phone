<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Dashboard - Owen HVAC</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #1f2937;
    }
    .topbar {
      height: 64px;
      background: white;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .title {
      font-size: 20px;
      font-weight: 700;
    }
    .top-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .btn {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 14px;
    }
    .btn-dark {
      background: #0f172a;
      color: white;
    }
    .btn-light {
      background: white;
      border: 1px solid #d1d5db;
      color: #111827;
    }

    .layout {
      display: grid;
      grid-template-columns: 320px 1fr 360px;
      gap: 16px;
      padding: 16px;
      height: calc(100vh - 64px);
    }

    .panel {
      background: white;
      border-radius: 16px;
      border: 1px solid #e5e7eb;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-header {
      padding: 14px 16px;
      border-bottom: 1px solid #eef2f7;
      font-weight: 700;
      font-size: 16px;
    }

    .panel-body {
      padding: 14px 16px;
      overflow: auto;
      min-height: 0;
      flex: 1;
    }

    .call-card {
      border: 1px solid #dbe3ef;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: 0.15s ease;
      background: #fff;
    }
    .call-card:hover {
      border-color: #9fb4d1;
      background: #fbfdff;
    }
    .call-card.active {
      border-color: #3b82f6;
      background: #f8fbff;
    }
    .call-line {
      margin: 4px 0;
      font-size: 14px;
      word-break: break-all;
    }
    .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      background: #e8f3ff;
      color: #1d4ed8;
    }

    .transcript-wrap {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .bubble {
      padding: 14px;
      border-radius: 14px;
      line-height: 1.5;
      font-size: 15px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bubble.assistant {
      background: #dfeaf9;
    }
    .bubble.caller {
      background: #f3e9b7;
    }
    .bubble-role {
      font-weight: 700;
      margin-bottom: 6px;
      opacity: 0.85;
    }

    .field {
      margin-bottom: 14px;
    }
    .field label {
      display: block;
      margin-bottom: 6px;
      color: #6b7280;
      font-size: 13px;
    }
    .field-value {
      min-height: 42px;
      border: 1px solid #d7dce5;
      border-radius: 12px;
      background: #fafbfc;
      padding: 10px 12px;
      font-size: 14px;
      word-break: break-word;
    }

    .calendar-box {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid #eef2f7;
    }

    .mini-status {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      background: #ecfdf5;
      color: #047857;
      font-size: 12px;
      margin-left: 8px;
    }

    .empty {
      color: #6b7280;
      font-size: 14px;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    @media (max-width: 1280px) {
      .layout {
        grid-template-columns: 280px 1fr 320px;
      }
    }

    @media (max-width: 980px) {
      .layout {
        grid-template-columns: 1fr;
        height: auto;
      }
      .panel {
        min-height: 320px;
      }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="title">Owen HVAC Live Dashboard</div>
    <div class="top-actions">
      <button class="btn btn-light" id="refreshBtn">Refresh</button>
      <a href="/logout" style="text-decoration:none;">
      <button class="btn btn-dark" type="button">Logout</button>
    </a>>
    </div>
  </div>

  <div class="layout">
    <div class="panel">
      <div class="panel-header">Calls</div>
      <div class="panel-body" id="callsList">
        <div class="empty">Loading calls...</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header" id="transcriptHeader">Live Transcript</div>
      <div class="panel-body" id="transcriptPanel">
        <div class="empty">Select a call to view transcript.</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        Extracted Fields
        <span class="mini-status" id="calendarConnectedTag">Calendar: ...</span>
      </div>
      <div class="panel-body">
        <div class="field"><label>Call SID</label><div class="field-value" id="fCallSid"></div></div>
        <div class="field"><label>From</label><div class="field-value" id="fFrom"></div></div>
        <div class="field"><label>To</label><div class="field-value" id="fTo"></div></div>
        <div class="field"><label>Status</label><div class="field-value" id="fStatus"></div></div>
        <div class="field"><label>Intent</label><div class="field-value" id="fIntent"></div></div>
        <div class="field"><label>Caller Name</label><div class="field-value" id="fName"></div></div>
        <div class="field"><label>Callback Number</label><div class="field-value" id="fPhone"></div></div>
        <div class="field"><label>Service Address</label><div class="field-value" id="fAddress"></div></div>
        <div class="field"><label>Issue Summary</label><div class="field-value" id="fIssue"></div></div>
        <div class="field"><label>Preferred Date</label><div class="field-value" id="fDate"></div></div>
        <div class="field"><label>Preferred Time</label><div class="field-value" id="fTime"></div></div>
        <div class="field"><label>Booking Confirmed</label><div class="field-value" id="fConfirmed"></div></div>
        <div class="field"><label>Appointment Created</label><div class="field-value" id="fApptCreated"></div></div>
        <div class="field"><label>Appointment Event ID</label><div class="field-value" id="fApptEventId"></div></div>

        <div class="actions">
          <button class="btn btn-light" id="reextractBtn">Re-extract</button>
          <button class="btn btn-dark" id="createAppointmentBtn">Create Appointment</button>
        </div>

        <div class="calendar-box">
          <div style="font-weight:700; margin-bottom:12px;">Google Calendar Status</div>

          <div class="field"><label>Connected</label><div class="field-value" id="cConnected"></div></div>
          <div class="field"><label>Calendar ID</label><div class="field-value" id="cCalendarId"></div></div>
          <div class="field"><label>Summary</label><div class="field-value" id="cSummary"></div></div>
          <div class="field"><label>Timezone</label><div class="field-value" id="cTimezone"></div></div>
          <div class="field"><label>Today Date</label><div class="field-value" id="cTodayDate"></div></div>
          <div class="field"><label>Today's Event Count</label><div class="field-value" id="cEventCount"></div></div>
          <div class="field"><label>Today's Available Slots</label><div class="field-value" id="cAvailableSlots"></div></div>
          <div class="field"><label>Last Error</label><div class="field-value" id="cError"></div></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let selectedCallSid = null;
    let callsCache = [];

    function setText(id, value) {
      document.getElementById(id).textContent = value || "";
    }

    async function fetchJson(url, options) {
      const res = await fetch(url, options);
      if (!res.ok) {
        let msg = `HTTP ${res.status}`;
        try {
          const data = await res.json();
          msg = data.error || msg;
        } catch (_) {}
        throw new Error(msg);
      }
      return await res.json();
    }

    function renderCalls(calls) {
      const root = document.getElementById("callsList");
      if (!calls.length) {
        root.innerHTML = `<div class="empty">No calls yet.</div>`;
        return;
      }

      root.innerHTML = calls.map(call => `
        <div class="call-card ${selectedCallSid === call.callSid ? 'active' : ''}" data-callsid="${call.callSid}">
          <div class="call-line" style="font-size:22px; font-weight:700;">${call.from || "Unknown"}</div>
          <div class="call-line">CallSid: ${call.callSid}</div>
          <div class="call-line">Status: <span class="tag">${call.status || ""}</span></div>
          <div class="call-line">Intent: ${call.intent || ""}</div>
        </div>
      `).join("");

      root.querySelectorAll(".call-card").forEach(el => {
        el.addEventListener("click", () => {
          selectedCallSid = el.dataset.callsid;
          renderCalls(callsCache);
          loadCallDetail(selectedCallSid);
        });
      });
    }

    function renderTranscript(call) {
      const header = document.getElementById("transcriptHeader");
      const panel = document.getElementById("transcriptPanel");

      header.textContent = `Live Transcript${call ? ` - ${call.callSid}` : ""}`;

      if (!call || !call.transcript || !call.transcript.length) {
        panel.innerHTML = `<div class="empty">No transcript yet.</div>`;
        return;
      }

      panel.innerHTML = `
        <div class="transcript-wrap">
          ${call.transcript.map(item => `
            <div class="bubble ${item.role === 'assistant' ? 'assistant' : 'caller'}">
              <div class="bubble-role">${item.role}:</div>
              <div>${escapeHtml(item.text)}</div>
            </div>
          `).join("")}
        </div>
      `;
      panel.scrollTop = panel.scrollHeight;
    }

    function renderFields(call) {
      if (!call) {
        [
          "fCallSid","fFrom","fTo","fStatus","fIntent","fName","fPhone","fAddress",
          "fIssue","fDate","fTime","fConfirmed","fApptCreated","fApptEventId"
        ].forEach(id => setText(id, ""));
        return;
      }

      const f = call.extracted || {};
      setText("fCallSid", call.callSid || "");
      setText("fFrom", call.from || "");
      setText("fTo", call.to || "");
      setText("fStatus", call.status || "");
      setText("fIntent", f.intent || "");
      setText("fName", f.callerName || "");
      setText("fPhone", f.callbackNumber || "");
      setText("fAddress", f.serviceAddress || "");
      setText("fIssue", f.issueSummary || "");
      setText("fDate", f.preferredDate || "");
      setText("fTime", f.preferredTime || "");
      setText("fConfirmed", String(!!f.bookingConfirmed));
      setText("fApptCreated", String(!!f.appointmentCreated));
      setText("fApptEventId", f.appointmentEventId || "");
    }

    async function loadCalls() {
      const data = await fetchJson("/api/live-calls");
      callsCache = data.calls || [];
      renderCalls(callsCache);

      if (!selectedCallSid && callsCache.length) {
        selectedCallSid = callsCache[0].callSid;
        renderCalls(callsCache);
      }

      if (selectedCallSid) {
        await loadCallDetail(selectedCallSid, false);
      }
    }

    async function loadCallDetail(callSid, showErrors = true) {
      try {
        const data = await fetchJson(`/api/live-call/${encodeURIComponent(callSid)}`);
        renderTranscript(data.call);
        renderFields(data.call);
      } catch (err) {
        if (showErrors) {
          console.error(err);
        }
      }
    }

    async function loadCalendarStatus() {
      try {
        const data = await fetchJson("/api/calendar/status");
        setText("cConnected", String(!!data.connected));
        setText("cCalendarId", data.calendarId || "");
        setText("cSummary", data.summary || "");
        setText("cTimezone", data.timeZone || "");
        setText("cTodayDate", data.todayDate || "");
        setText("cEventCount", String(data.todayEventCount ?? ""));
        setText("cAvailableSlots", String(data.todayAvailableSlots ?? ""));
        setText("cError", "");
        document.getElementById("calendarConnectedTag").textContent = "Calendar: Connected";
      } catch (err) {
        setText("cConnected", "false");
        setText("cCalendarId", "");
        setText("cSummary", "");
        setText("cTimezone", "");
        setText("cTodayDate", "");
        setText("cEventCount", "");
        setText("cAvailableSlots", "");
        setText("cError", err.message || "Calendar error");
        document.getElementById("calendarConnectedTag").textContent = "Calendar: Error";
      }
    }

    async function reextractCurrent() {
      if (!selectedCallSid) return;
      await fetchJson(`/api/live-call/${encodeURIComponent(selectedCallSid)}/refresh-extraction`, {
      method: "POST"
      });
      await loadCallDetail(selectedCallSid);
      await loadCalls();
      await loadCalendarStatus();
    }

    async function createAppointmentCurrent() {
      if (!selectedCallSid) return;
      try {
        const data = await fetchJson(`/api/live-call/${encodeURIComponent(selectedCallSid)}/create-appointment`, {
          method: "POST"
        });
        alert(`Appointment created successfully.`);
      } catch (err) {
        alert(err.message || "Failed to create appointment");
      }
      await loadCallDetail(selectedCallSid);
      await loadCalls();
      await loadCalendarStatus();
    }

    function escapeHtml(str) {
      return (str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    document.getElementById("refreshBtn").addEventListener("click", async () => {
      await loadCalls();
      await loadCalendarStatus();
    });

    document.getElementById("reextractBtn").addEventListener("click", reextractCurrent);
    document.getElementById("createAppointmentBtn").addEventListener("click", createAppointmentCurrent);

    async function tick() {
      await loadCalls();
      await loadCalendarStatus();
    }

    tick();
    setInterval(tick, 3000);
  </script>
</body>
</html>
