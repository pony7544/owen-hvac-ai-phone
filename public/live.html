<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Owen HVAC Live Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    .topbar {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: #111827;
      color: #fff;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      border: 0;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.18s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn-light {
      background: #fff;
      color: #111827;
    }

    .btn-dark {
      background: #2563eb;
      color: #fff;
    }

    .btn-muted {
      background: #e5e7eb;
      color: #111827;
    }

    .layout {
      display: grid;
      grid-template-columns: 320px 1fr 380px;
      gap: 16px;
      padding: 16px;
      height: calc(100vh - 72px);
    }

    .panel {
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .panel-header {
      padding: 18px 18px 12px;
      font-size: 18px;
      font-weight: 700;
      border-bottom: 1px solid #eef2f7;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .panel-body {
      padding: 16px 18px 18px;
      overflow: auto;
      min-height: 0;
    }

    .call-card {
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: 0.16s ease;
      background: #fff;
    }

    .call-card:hover {
      border-color: #93c5fd;
      background: #f8fbff;
    }

    .call-card.active {
      border-color: #2563eb;
      background: #eff6ff;
      box-shadow: inset 0 0 0 1px #2563eb;
    }

    .call-line {
      font-size: 13px;
      line-height: 1.45;
      margin-bottom: 4px;
      color: #374151;
      word-break: break-word;
    }

    .tag {
      display: inline-block;
      padding: 3px 8px;
      font-size: 12px;
      border-radius: 999px;
      background: #e5edff;
      color: #1d4ed8;
      font-weight: 700;
    }

    .tag-green {
      background: #ecfdf5;
      color: #047857;
    }

    .tag-yellow {
      background: #fff7ed;
      color: #c2410c;
    }

    .tag-gray {
      background: #f3f4f6;
      color: #4b5563;
    }

    .transcript-wrap {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .bubble {
      padding: 14px;
      border-radius: 14px;
      line-height: 1.5;
      font-size: 15px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .bubble.assistant {
      background: #dfeaf9;
    }

    .bubble.caller {
      background: #f3e9b7;
    }

    .bubble-role {
      font-weight: 700;
      margin-bottom: 6px;
      opacity: 0.85;
      text-transform: capitalize;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      color: #6b7280;
      font-size: 13px;
      font-weight: 600;
    }

    .field-value {
      min-height: 42px;
      border: 1px solid #d7dce5;
      border-radius: 12px;
      background: #fafbfc;
      padding: 10px 12px;
      font-size: 14px;
      word-break: break-word;
      line-height: 1.45;
    }

    .calendar-box {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid #eef2f7;
    }

    .mini-status {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      background: #ecfdf5;
      color: #047857;
      font-size: 12px;
      margin-left: 8px;
      white-space: nowrap;
    }

    .empty {
      color: #6b7280;
      font-size: 14px;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .recording-box {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid #eef2f7;
    }

    audio {
      width: 100%;
      margin-top: 12px;
    }

    .small-note {
      font-size: 12px;
      color: #6b7280;
      margin-top: 6px;
      line-height: 1.4;
    }

    @media (max-width: 1280px) {
      .layout {
        grid-template-columns: 280px 1fr 340px;
      }
    }

    @media (max-width: 980px) {
      .layout {
        grid-template-columns: 1fr;
        height: auto;
      }

      .panel {
        min-height: 320px;
      }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="title">Owen HVAC Live Dashboard</div>
    <div class="top-actions">
      <button class="btn btn-light" id="refreshBtn">Refresh</button>
      <a href="/logout" style="text-decoration:none;">
        <button class="btn btn-dark" type="button">Logout</button>
      </a>
    </div>
  </div>

  <div class="layout">
    <div class="panel">
      <div class="panel-header">Calls</div>
      <div class="panel-body" id="callsList">
        <div class="empty">Loading calls.</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header" id="transcriptHeader">Live Transcript</div>
      <div class="panel-body" id="transcriptPanel">
        <div class="empty">Select a call to view transcript.</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        Extracted Fields
        <span class="mini-status" id="calendarConnectedTag">Calendar: Checking</span>
      </div>
      <div class="panel-body">
        <div class="field"><label>Call SID</label><div class="field-value" id="fCallSid"></div></div>
        <div class="field"><label>From</label><div class="field-value" id="fFrom"></div></div>
        <div class="field"><label>To</label><div class="field-value" id="fTo"></div></div>
        <div class="field"><label>Status</label><div class="field-value" id="fStatus"></div></div>
        <div class="field"><label>Intent</label><div class="field-value" id="fIntent"></div></div>
        <div class="field"><label>Caller Name</label><div class="field-value" id="fName"></div></div>
        <div class="field"><label>Callback Number</label><div class="field-value" id="fPhone"></div></div>
        <div class="field"><label>Service Address</label><div class="field-value" id="fAddress"></div></div>
        <div class="field"><label>Issue Summary</label><div class="field-value" id="fIssue"></div></div>
        <div class="field"><label>Preferred Date</label><div class="field-value" id="fDate"></div></div>
        <div class="field"><label>Preferred Time</label><div class="field-value" id="fTime"></div></div>
        <div class="field"><label>Booking Confirmed</label><div class="field-value" id="fConfirmed"></div></div>
        <div class="field"><label>Appointment Created</label><div class="field-value" id="fApptCreated"></div></div>
        <div class="field"><label>Appointment Event ID</label><div class="field-value" id="fApptEventId"></div></div>

        <div class="actions">
          <button class="btn btn-light" id="reextractBtn">Re-extract</button>
          <button class="btn btn-dark" id="createAppointmentBtn">Create Appointment</button>
          <button class="btn btn-muted" id="playRecordingBtn">Play Recording</button>
        </div>

        <div class="recording-box">
          <div style="font-weight:700; margin-bottom:12px;">Call Recording</div>
          <div class="field"><label>Recording Status</label><div class="field-value" id="rStatus"></div></div>
          <div class="field"><label>Duration (sec)</label><div class="field-value" id="rDuration"></div></div>
          <div class="field"><label>Expires At</label><div class="field-value" id="rExpiresAt"></div></div>
          <div class="field"><label>Deleted At</label><div class="field-value" id="rDeletedAt"></div></div>
          <audio id="recordingPlayer" controls style="display:none;"></audio>
          <div class="small-note">Select a call, then click Play Recording.</div>
        </div>

        <div class="calendar-box">
          <div style="font-weight:700; margin-bottom:12px;">Calendar Status</div>
          <div class="field"><label>Connected</label><div class="field-value" id="cConnected"></div></div>
          <div class="field"><label>Calendar ID</label><div class="field-value" id="cCalendarId"></div></div>
          <div class="field"><label>Summary</label><div class="field-value" id="cSummary"></div></div>
          <div class="field"><label>Time Zone</label><div class="field-value" id="cTimezone"></div></div>
          <div class="field"><label>Today's Date</label><div class="field-value" id="cTodayDate"></div></div>
          <div class="field"><label>Today's Event Count</label><div class="field-value" id="cEventCount"></div></div>
          <div class="field"><label>Today's Available Slots</label><div class="field-value" id="cAvailableSlots"></div></div>
          <div class="field"><label>Last Error</label><div class="field-value" id="cError"></div></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let selectedCallSid = null;
    let callsCache = [];

    function setText(id, value) {
      const el = document.getElementById(id);
      if (el) el.textContent = value || "";
    }

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    async function fetchJson(url, options) {
      const res = await fetch(url, options);
      if (!res.ok) {
        let msg = `HTTP ${res.status}`;
        try {
          const data = await res.json();
          msg = data.error || msg;
        } catch (_) {}
        throw new Error(msg);
      }
      return await res.json();
    }

    function getStatusTagClass(status) {
      const s = String(status || "").toLowerCase();
      if (s.includes("complete") || s.includes("connected") || s.includes("ready")) return "tag tag-green";
      if (s.includes("fail") || s.includes("error") || s.includes("deleted")) return "tag tag-yellow";
      if (!s) return "tag tag-gray";
      return "tag";
    }

    function renderCalls(calls) {
      const root = document.getElementById("callsList");

      if (!calls.length) {
        root.innerHTML = `<div class="empty">No calls yet.</div>`;
        return;
      }

      root.innerHTML = calls.map(call => {
        const extracted = call.extracted || {};
        const displayIntent = extracted.intent || call.intent || "";
        return `
          <div class="call-card ${selectedCallSid === call.callSid ? "active" : ""}" data-callsid="${escapeHtml(call.callSid || "")}">
            <div class="call-line" style="font-size:20px; font-weight:700;">${escapeHtml(call.from || "Unknown")}</div>
            <div class="call-line">CallSid: ${escapeHtml(call.callSid || "")}</div>
            <div class="call-line">Status: <span class="${getStatusTagClass(call.status)}">${escapeHtml(call.status || "")}</span></div>
            <div class="call-line">Intent: ${escapeHtml(displayIntent || "")}</div>
          </div>
        `;
      }).join("");

      root.querySelectorAll(".call-card").forEach(el => {
        el.addEventListener("click", () => {
          selectedCallSid = el.dataset.callsid;
          renderCalls(callsCache);
          loadCallDetail(selectedCallSid);
        });
      });
    }

    function renderTranscript(call) {
      const header = document.getElementById("transcriptHeader");
      const panel = document.getElementById("transcriptPanel");

      header.textContent = `Live Transcript${call ? ` - ${call.callSid}` : ""}`;

      if (!call || !Array.isArray(call.transcript) || !call.transcript.length) {
        panel.innerHTML = `<div class="empty">No transcript yet.</div>`;
        return;
      }

      panel.innerHTML = `
        <div class="transcript-wrap">
          ${call.transcript.map(item => `
            <div class="bubble ${item.role === "assistant" ? "assistant" : "caller"}">
              <div class="bubble-role">${escapeHtml(item.role || "caller")}:</div>
              <div>${escapeHtml(item.text || "")}</div>
            </div>
          `).join("")}
        </div>
      `;
      panel.scrollTop = panel.scrollHeight;
    }

    function renderFields(call) {
      if (!call) {
        [
          "fCallSid","fFrom","fTo","fStatus","fIntent","fName","fPhone",
          "fAddress","fIssue","fDate","fTime","fConfirmed","fApptCreated","fApptEventId"
        ].forEach(id => setText(id, ""));
        return;
      }

      const f = call.extracted || {};
      setText("fCallSid", call.callSid || "");
      setText("fFrom", call.from || "");
      setText("fTo", call.to || "");
      setText("fStatus", call.status || "");
      setText("fIntent", f.intent || call.intent || "");
      setText("fName", f.callerName || "");
      setText("fPhone", f.callbackNumber || "");
      setText("fAddress", f.serviceAddress || "");
      setText("fIssue", f.issueSummary || "");
      setText("fDate", f.preferredDate || "");
      setText("fTime", f.preferredTime || "");
      setText("fConfirmed", String(!!f.bookingConfirmed));
      setText("fApptCreated", String(!!f.appointmentCreated));
      setText("fApptEventId", f.appointmentEventId || "");
    }

    function renderRecording(call) {
      const rec = call?.recording || null;
      const player = document.getElementById("recordingPlayer");

      if (!rec) {
        setText("rStatus", "");
        setText("rDuration", "");
        setText("rExpiresAt", "");
        setText("rDeletedAt", "");
        player.pause();
        player.removeAttribute("src");
        player.load();
        player.style.display = "none";
        return;
      }

      setText("rStatus", rec.status || "");
      setText("rDuration", String(rec.durationSec || ""));
      setText("rExpiresAt", rec.expiresAt || "");
      setText("rDeletedAt", rec.deletedAt || "");

      player.pause();
      player.removeAttribute("src");
      player.load();
      player.style.display = "none";
    }

    async function loadCalls() {
      const data = await fetchJson("/api/live/calls");
      callsCache = data.calls || [];
      renderCalls(callsCache);

      if (!selectedCallSid && callsCache.length) {
        selectedCallSid = callsCache[0].callSid;
        renderCalls(callsCache);
      }

      if (selectedCallSid) {
        await loadCallDetail(selectedCallSid, false);
      }
    }

    async function loadCallDetail(callSid, showErrors = true) {
      try {
        const data = await fetchJson(`/api/live-call/${encodeURIComponent(callSid)}`);
        renderTranscript(data.call);
        renderFields(data.call);
        renderRecording(data.call);
      } catch (err) {
        if (showErrors) {
          console.error(err);
        }
      }
    }

    async function loadCalendarStatus() {
      try {
        const data = await fetchJson("/api/calendar/status");
        setText("cConnected", String(!!data.connected));
        setText("cCalendarId", data.calendarId || "");
        setText("cSummary", data.summary || "");
        setText("cTimezone", data.timeZone || "");
        setText("cTodayDate", data.todayDate || "");
        setText("cEventCount", String(data.todayEventCount ?? ""));
        setText("cAvailableSlots", String(data.todayAvailableSlots ?? ""));
        setText("cError", "");
        document.getElementById("calendarConnectedTag").textContent = "Calendar: Connected";
      } catch (err) {
        setText("cConnected", "false");
        setText("cCalendarId", "");
        setText("cSummary", "");
        setText("cTimezone", "");
        setText("cTodayDate", "");
        setText("cEventCount", "");
        setText("cAvailableSlots", "");
        setText("cError", err.message || "Calendar error");
        document.getElementById("calendarConnectedTag").textContent = "Calendar: Error";
      }
    }

    async function reextractCurrent() {
      if (!selectedCallSid) return;
      await fetchJson(`/api/live-call/${encodeURIComponent(selectedCallSid)}/refresh-extraction`, {
        method: "POST"
      });
      await loadCallDetail(selectedCallSid);
      await loadCalls();
      await loadCalendarStatus();
    }

    async function createAppointmentCurrent() {
      if (!selectedCallSid) return;
      try {
        const data = await fetchJson(`/api/live-call/${encodeURIComponent(selectedCallSid)}/create-appointment`, {
          method: "POST"
        });
        alert(`Appointment created successfully.${data.event?.id ? ` Event ID: ${data.event.id}` : ""}`);
      } catch (err) {
        alert(err.message || "Failed to create appointment");
      }
      await loadCallDetail(selectedCallSid);
      await loadCalls();
      await loadCalendarStatus();
    }

    async function playCurrentRecording() {
      if (!selectedCallSid) return;

      try {
        const data = await fetchJson(`/api/live-call/${encodeURIComponent(selectedCallSid)}/recording`);
        const rec = data.recording || {};

        setText("rStatus", rec.status || "");
        setText("rDuration", String(rec.durationSec || ""));
        setText("rExpiresAt", rec.expiresAt || "");
        setText("rDeletedAt", rec.deletedAt || "");

        if (!rec.available || !rec.streamUrl) {
          alert("Recording is not ready yet.");
          return;
        }

        const player = document.getElementById("recordingPlayer");
        player.src = rec.streamUrl;
        player.style.display = "block";
        await player.play();
      } catch (err) {
        console.error(err);
        alert(err.message || "Failed to play recording");
      }
    }

    document.getElementById("refreshBtn").addEventListener("click", async () => {
      await loadCalls();
      await loadCalendarStatus();
    });

    document.getElementById("reextractBtn").addEventListener("click", reextractCurrent);
    document.getElementById("createAppointmentBtn").addEventListener("click", createAppointmentCurrent);
    document.getElementById("playRecordingBtn").addEventListener("click", playCurrentRecording);

    async function tick() {
      await loadCalls();
      await loadCalendarStatus();
    }

    tick();
    setInterval(tick, 3000);
  </script>
</body>
</html>
